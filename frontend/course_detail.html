<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>课程详情 - 在线教育平台</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .comment-item { padding: 12px; border-bottom: 1px solid #eee; }
        .comment-user { color: #4a90d9; font-weight: bold; }
        .comment-time { color: #999; font-size: 12px; margin-left: 10px; }
        .comment-content { margin: 8px 0; color: #333; }
        .comment-actions { display: flex; gap: 10px; align-items: center; }
        .like-btn { background: #f0f0f0; color: #666; padding: 4px 12px; border-radius: 4px; border: none; cursor: pointer; }
        .like-btn:hover { background: #e0e0e0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav">
            <a href="course_list.html">返回课程列表</a>
            <a href="order.html">我的订单</a>
            <a href="ai_chat.html">AI助手</a>
            <a href="javascript:logout()">退出</a>
        </div>
        <div class="card" id="detailCard">
            <div id="msg"></div>
            <div id="detail"></div>
        </div>

        <div class="card" id="commentCard" style="display:none;">
            <h2>课程评论</h2>
            <div id="commentInput" style="display:none;">
                <textarea id="content" placeholder="写下你的评论..." style="height:80px;"></textarea>
                <button onclick="submitComment()">发表评论</button>
            </div>
            <div id="commentTip" style="color:#999; margin-bottom:10px;"></div>
            <div id="commentList"></div>
        </div>
    </div>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        const userId = localStorage.getItem("userId") || 1;
        let currentCourseId = null;

        if (checkLogin()) loadDetail();

        function getUrlParam(name) {
            return new URLSearchParams(window.location.search).get(name);
        }

        async function loadDetail() {
            currentCourseId = getUrlParam("id");
            if (!currentCourseId) {
                window.location.href = "course_list.html";
                return;
            }
            const res = await request("/api/course/" + currentCourseId);
            const detail = document.getElementById("detail");
            if (res.status === 200 && res.data.title) {
                const c = res.data;
                detail.innerHTML = `
                    <h1>${c.title}</h1>
                    <p style="color:#666;margin:15px 0;">${c.description}</p>
                    <p>分类：${c.category || "未分类"}</p>
                    <p>库存：${c.stock}</p>
                    <p class="course-price" style="font-size:24px;">¥${c.price}</p>
                    <button onclick="createOrder(${c.id})" style="margin-top:15px;">立即购买</button>
                `;
                // 加载评论
                document.getElementById("commentCard").style.display = "block";
                loadComments();
            } else {
                detail.innerHTML = "<p>课程不存在</p>";
            }
        }

        async function createOrder(courseId) {
            const res = await request("/api/order/create", "POST", { user_id: parseInt(userId), course_id: courseId });
            if (res.status === 200) {
                showMsg("下单成功，订单号：" + res.data.order_id);
                loadComments();
            } else {
                showMsg(res.data.detail || "下单失败", "error");
            }
        }

        async function loadComments() {
            const res = await request("/api/comment/list/" + currentCourseId);
            const list = document.getElementById("commentList");
            const tip = document.getElementById("commentTip");
            const input = document.getElementById("commentInput");

            if (res.status === 200 && Array.isArray(res.data)) {
                // 判断是否购买过
                const hasPurchased = await checkPurchased();
                if (hasPurchased) {
                    input.style.display = "block";
                    tip.textContent = "";
                } else {
                    input.style.display = "none";
                    tip.textContent = "购买课程后即可发表评论";
                }

                if (res.data.length === 0) {
                    list.innerHTML = "<p>暂无评论，快来抢沙发~</p>";
                    return;
                }
                list.innerHTML = res.data.map(c => `
                    <div class="comment-item">
                        <span class="comment-user">${c.username}</span>
                        <span class="comment-time">${c.created_at}</span>
                        <div class="comment-content">${c.content}</div>
                        <div class="comment-actions">
                            <button class="like-btn" onclick="likeComment(${c.id})">👍 ${c.likes}</button>
                        </div>
                    </div>
                `).join("");
            }
        }

        async function checkPurchased() {
            const res = await request("/api/order/list/" + userId);
            if (res.status === 200 && res.data.data) {
                return res.data.data.some(o => o.course_id == currentCourseId && o.status !== "cancelled");
            }
            return false;
        }

        async function submitComment() {
            const content = document.getElementById("content").value.trim();
            if (!content) {
                showMsg("评论内容不能为空", "error");
                return;
            }
            const res = await request("/api/comment/add", "POST", {
                user_id: parseInt(userId),
                course_id: parseInt(currentCourseId),
                content: content
            });
            if (res.status === 200) {
                showMsg("评论成功");
                document.getElementById("content").value = "";
                loadComments();
            } else {
                showMsg(res.data.detail || "评论失败", "error");
            }
        }

        async function likeComment(id) {
            await request("/api/comment/like/" + id, "POST");
            loadComments();
        }
    </script>
</body>
</html>
