<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>课程列表 - 在线教育平台</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="nav">
            <a href="course_list.html">课程列表</a>
            <a href="order.html">我的订单</a>
            <a href="ai_chat.html">AI助手</a>
            <a href="javascript:logout()">退出</a>
        </div>
        <div class="card">
            <h1>课程列表</h1>
            <div id="msg"></div>
            <div id="courseList"></div>
        </div>
    </div>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        if (checkLogin()) loadCourses();

        async function loadCourses() {
            const res = await request("/api/course/list");
            const list = document.getElementById("courseList");
            if (res.status === 200 && res.data.data) {
                list.innerHTML = res.data.data.map(c => `
                    <div class="course-item">
                        <div>
                            <div class="course-title">${c.title}</div>
                            <div style="color:#888;font-size:12px;">${c.description}</div>
                        </div>
                        <div>
                            <span class="course-price">¥${c.price}</span>
                            <button onclick="viewDetail(${c.id})" style="margin-left:10px;">查看</button>
                        </div>
                    </div>
                `).join("");
            }
        }

        function viewDetail(id) {
            window.location.href = "course_detail.html?id=" + id;
        }
    </script>
</body>
</html>
