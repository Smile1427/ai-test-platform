<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>登录 - 在线教育平台</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>在线教育平台</h1>
            <div id="msg"></div>
            <h2>登录</h2>
            <input type="text" id="username" placeholder="用户名">
            <input type="password" id="password" placeholder="密码">
            <button onclick="login()">登录</button>
            <button onclick="register()" style="background:#888;margin-left:10px;">注册</button>
        </div>
    </div>
    <script src="js/api.js"></script>
    <script>
        async function login() {
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;
            if (!username || !password) {
                showMsg("用户名和密码不能为空", "error");
                return;
            }
            const res = await request("/api/user/login", "POST", { username, password });
            if (res.status === 200) {
                saveToken(res.data.token);
                localStorage.setItem("userId", res.data.user_id);
                showMsg("登录成功，正在跳转...");
                setTimeout(() => { window.location.href = "course_list.html"; }, 1000);
            } else {
                showMsg(res.data.detail || "登录失败", "error");
            }
        }

        async function register() {
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;
            if (!username || !password) {
                showMsg("用户名和密码不能为空", "error");
                return;
            }
            const res = await request("/api/user/register", "POST", { username, password });
            if (res.status === 200) {
                showMsg("注册成功，请登录");
            } else {
                showMsg(res.data.detail || "注册失败", "error");
            }
        }
    </script>
</body>
</html>
