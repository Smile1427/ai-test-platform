name: Auto Test

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root123
          MYSQL_DATABASE: edu_platform
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7.0
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest requests pyyaml

      - name: 初始化数据库
        run: |
          cd backend
          python init_data.py
        env:
          DB_HOST: 127.0.0.1
          DB_PASSWORD: root123

      - name: 启动后端并运行所有测试
        run: |
          cd backend
          nohup uvicorn main:app --host 0.0.0.0 --port 8000 > /tmp/uvicorn.log 2>&1 &
          sleep 10
          cd ..
          python tests/case_runner.py
          python -m pytest test_ai/test_ai_features.py -v
          python tests/report_generator.py
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        continue-on-error: true

      - name: 打印后端日志
        if: always()
        run: cat /tmp/uvicorn.log

      - name: 上传测试报告
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: reports/

